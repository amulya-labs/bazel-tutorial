name: Bazel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  # PR runs: use PR number so runs for the same PR serialize
  # workflow_run events (called by other workflows): include repo+branch
  # Fallback for push/branch/scheduled runs: use workflow name + branch/ref
  group: ${{ 
    github.event_name == 'pull_request' && 
      format('{0}-pr-{1}', github.workflow, github.event.pull_request.number)
      ||
    github.event_name == 'workflow_run' &&
      format('{0}-run-{1}-{2}', github.workflow, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)
      ||
    format('{0}-branch-{1}', github.workflow, github.ref_name || github.ref)
    }}
  cancel-in-progress: true

jobs:
  # Internal CI: runs on self-hosted runners for push events and non-fork PRs
  # Uses persistent Bazel cache for faster builds and uploads coverage to Codecov
  build-and-test-internal:
    name: Build and Test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, cpu, small]
    container:
      image: gcr.io/bazel-public/bazel:6.4.0
      options: --user root
      volumes:
        - /var/cache/bazel:/root/.cache/bazel

    permissions:
      contents: read

    steps:
    - name: Runner info
      run: echo "Running on self-hosted runner with persistent Bazel cache"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify Bazel version
      run: bazel --version

    # Exclude web_ui:build as it requires npm which isn't in the bazel container
    - name: Build all targets
      run: bazel build //... -- -//web_ui:build

    - name: Run all tests with coverage
      run: |
        bazel coverage --combined_report=lcov //... -- -//web_ui:build
        # Copy coverage report to workspace for upload
        cp bazel-out/_coverage/_coverage_report.dat coverage.lcov || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.lcov
        fail_ci_if_error: false
        verbose: true

  # External CI: runs on GitHub-hosted runners for fork PRs
  # No persistent cache or Codecov upload (secrets not available to forks)
  build-and-test-external:
    name: Build and Test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container:
      image: gcr.io/bazel-public/bazel:6.4.0
      options: --user root

    permissions:
      contents: read

    steps:
    - name: Runner info
      run: echo "Running on GitHub-hosted runner (fork PR - no cache or coverage upload)"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify Bazel version
      run: bazel --version

    # Exclude web_ui:build as it requires npm which isn't in the bazel container
    - name: Build all targets
      run: bazel build //... -- -//web_ui:build

    - name: Run all tests
      run: bazel test //... -- -//web_ui:build

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install mkdocs dependencies
      run: |
        pip install -r docs-requirements.txt

    - name: Validate mkdocs build
      run: |
        mkdocs build --strict
