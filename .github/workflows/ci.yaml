name: Bazel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  # PR runs: use PR number so runs for the same PR serialize
  # workflow_run events (called by other workflows): include repo+branch
  # Fallback for push/branch/scheduled runs: use workflow name + branch/ref
  group: ${{ 
    github.event_name == 'pull_request' && 
      format('{0}-pr-{1}', github.workflow, github.event.pull_request.number)
      ||
    github.event_name == 'workflow_run' &&
      format('{0}-run-{1}-{2}', github.workflow, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)
      ||
    format('{0}-branch-{1}', github.workflow, github.ref_name || github.ref)
    }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: [self-hosted, Linux, small, cpu]
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bazelisk
      uses: bazelbuild/setup-bazelisk@v2
    
    - name: Build all targets
      run: bazel build //...
      
    - name: Run all tests
      run: bazel test //...
      
    - name: Verify Go service
      run: bazel build //go_service:server
      
    - name: Verify Python service
      run: bazel build //py_service:server
    
    - name: Verify Go fetch service
      run: bazel build //go_fetch:refresh
    
    - name: Verify Python API service
      run: bazel build //py_api:server
    
    - name: Run Go fetch tests
      run: bazel test //go_fetch:fred_test
    
    - name: Run Python API tests
      run: bazel test //py_api:api_test
