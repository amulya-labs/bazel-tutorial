name: Update Economic Dashboard

# This workflow fetches economic data from FRED API, exports to JSON files,
# commits them to the repository, and deploys to GitHub Pages.
#
# REQUIRED SECRETS:
# - FRED_API_KEY: API key from https://fred.stlouisfed.org/docs/api/api_key.html
# - WORKFLOW_PAT: Personal Access Token with 'repo' and 'workflow' permissions
#   This PAT is needed to bypass branch protection rules when committing data updates.
#   Create at: https://github.com/settings/tokens
#   Required permissions: repo, workflow
#   Add as repository secret: Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    # Run daily at 12:00 UTC (after markets close)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Only need to commit data updates

concurrency:
  group: "dashboard-update"
  cancel-in-progress: true  # Cancel old runs when new one starts

jobs:
  update-data:
    name: Fetch and Export Economic Data
    runs-on: [self-hosted, linux, cpu, small]
    container:
      image: gcr.io/bazel-public/bazel:6.4.0
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Verify Bazel installation
        run: bazel --version

      - name: Fetch economic data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # Create data directory
          mkdir -p data

          # Fetch data and export to JSON
          bazel run //go_fetch:refresh -- \
            --db="${PWD}/data/econ.db" \
            --export-json="${PWD}/web_ui/public/data"

      - name: Verify JSON files were created
        run: |
          echo "Checking generated JSON files:"
          ls -lh web_ui/public/data/
          echo ""
          echo "Summary preview:"
          head -20 web_ui/public/data/summary.json

      - name: Commit and push updated data
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the JSON files
          git add web_ui/public/data/*.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update economic data $(date -u +%Y-%m-%d)"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: commit

      - name: Notify deployment
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          echo "✅ Economic data updated successfully!"
          echo ""
          echo "The documentation workflow will automatically rebuild and deploy"
          echo "the dashboard with the new data on the next push to main."
          echo ""
          echo "Dashboard URL: https://rrl-personal-projects.github.io/bazel-tutorial/dashboard/"
