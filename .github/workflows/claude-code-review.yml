name: Claude Code Review

on:
  # 1. Manual trigger from Actions tab
  workflow_dispatch:

  # 2 & 3. PR events
  pull_request:
    types:
      - ready_for_review        # draft -> ready
      - review_requested        # added individual reviewer
      - review_requested_team   # added team reviewer
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  # PR runs: use PR number so runs for the same PR serialize
  # workflow_run events (called by other workflows): include repo+branch
  # Fallback for push/branch/scheduled runs: use workflow name + branch/ref
  group: ${{ 
    github.event_name == 'pull_request' && 
      format('{0}-pr-{1}', github.workflow, github.event.pull_request.number)
      ||
    github.event_name == 'workflow_run' &&
      format('{0}-run-{1}-{2}', github.workflow, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)
      ||
    format('{0}-branch-{1}', github.workflow, github.ref_name || github.ref)
    }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

